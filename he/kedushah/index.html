<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ספר קדושה — משנה תורה</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a1a;color:#e0d5c1;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:1rem}.container{max-width:600px;margin:0 auto}h1{color:#c9a84c;text-align:center;font-size:2rem;margin-bottom:.3rem}.subtitle{text-align:center;color:#888;margin-bottom:2rem;font-size:.9rem}.back{display:block;text-align:center;color:#c9a84c;text-decoration:none;margin-bottom:2rem}.book{display:block;background:#222;border:1px solid #333;border-radius:10px;padding:1.2rem;margin-bottom:.8rem;text-decoration:none;color:#e0d5c1;transition:all .2s}.book:hover{border-color:#c9a84c;background:#2a2520}.book-title{font-size:1.2rem;color:#c9a84c}</style></head><body><div id="refua-banner" style="background:#2a2520;border-bottom:2px solid #c9a84c;padding:10px 40px 10px 16px;text-align:center;font-family:'David','Noto Serif Hebrew',serif;color:#c9a84c;font-size:1.1rem;position:fixed;top:0;left:0;right:0;z-index:200;direction:rtl">לרפואת פייגא בת יטא רבקה<button onclick="document.getElementById('refua-banner').style.display='none'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer;padding:4px 8px">✕</button></div><div class="container" style="padding-top:50px"><h1>📖 ספר קדושה</h1><div class="subtitle">53 פרקים · 3 חלקים</div><a href="../" class="back">← חזרה לדף הראשי</a><a href="forbidden-intercourse/" class="book"><div class="book-title">🚫 הלכות איסורי ביאה</div><div style="color:#888;font-size:.9rem;margin-top:.3rem">22 פרקים</div></a><a href="forbidden-foods/" class="book"><div class="book-title">🍖 הלכות מאכלות אסורות</div><div style="color:#888;font-size:.9rem;margin-top:.3rem">17 פרקים</div></a><a href="ritual-slaughter/" class="book"><div class="book-title">🔪 הלכות שחיטה</div><div style="color:#888;font-size:.9rem;margin-top:.3rem">14 פרקים</div></a></div>
<!-- Font Size Control -->
<style>
:root{--fs-scale:1}
.fs-ctl{position:fixed;bottom:60px;left:12px;z-index:999;display:flex;align-items:center;gap:0;background:#222e;border:1px solid #333;border-radius:20px;padding:2px;opacity:0.35;transition:opacity 0.3s;backdrop-filter:blur(6px);user-select:none}
.fs-ctl:hover{opacity:1}
.fs-btn{background:none;border:none;color:#c9a84c;font-weight:700;cursor:pointer;padding:4px 8px;font-size:0.85rem;line-height:1;border-radius:16px;transition:background 0.2s}
.fs-btn:hover{background:#c9a84c22}
.fs-btn:active{background:#c9a84c44}
.fs-label{color:#888;font-size:0.65rem;padding:0 2px;min-width:28px;text-align:center}
</style>
<div class="fs-ctl" title="Adjust font size">
<button class="fs-btn" onclick="adjFS(-1)" aria-label="Decrease font size">A−</button>
<span class="fs-label" id="fs-pct">100%</span>
<button class="fs-btn" onclick="adjFS(1)" aria-label="Increase font size">A+</button>
</div>
<script>
(function(){
  var STEPS=[0.8,0.85,0.9,0.95,1,1.05,1.1,1.15,1.2,1.3,1.4,1.5];
  var idx=parseInt(localStorage.getItem('mt-fs-idx'));
  if(isNaN(idx))idx=4;
  apply();
  window.adjFS=function(d){idx=Math.max(0,Math.min(STEPS.length-1,idx+d));localStorage.setItem('mt-fs-idx',idx);apply()};
  function apply(){
    var s=STEPS[idx];
    document.documentElement.style.setProperty('--fs-scale',s);
    document.body.style.fontSize=(s*100)+'%';
    var el=document.getElementById('fs-pct');
    if(el)el.textContent=Math.round(s*100)+'%';
  }
})();
</script>

</body></html>
